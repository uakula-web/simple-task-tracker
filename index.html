<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tracker-container">
        <h1>Daily Task Tracker</h1>
        <p>B.Tech Placement Foundations | Built with HTML, CSS & JS</p>

        <!-- Input Section -->
        <div class="input-section">
            <input type="text" id="task-input" placeholder="Add a new challenge or task...">
            <button id="add-btn">Add Task</button>
        </div>

        <!-- Task List Container -->
        <ul id="task-list">
            <!-- Dynamic tasks will be added here by JavaScript -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
